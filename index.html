<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>十一山西自驾 · 同行共享版</title><style>
*{box-sizing:border-box}html,body{margin:0;height:100%;background:#ebe4d5;color:#173e34;font:14px -apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif}.shell{height:100%;display:flex;flex-direction:column}.bar{background:#fffaf0;border-bottom:1px solid #d8cdb8;padding:11px 18px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;z-index:20;box-shadow:0 4px 16px #3e342310}.brand b{font:700 20px/1.1 Georgia,"Songti SC",serif;color:#294d41}.brand span{display:block;margin-top:4px;color:#756c5d;font-size:12px}.tabs,.sections{display:flex;gap:7px;overflow-x:auto;white-space:nowrap}.tabs button,.sections a{border:1px solid #d6c6a8;border-radius:999px;background:#fffdf7;color:#5d4935;padding:8px 12px;text-decoration:none;cursor:pointer}.tabs button.active,.sections a.active{background:#244f40;color:#fff;border-color:#244f40}.sections{padding:8px 12px;background:#f5edde;border-bottom:1px solid #d8cdb8}.framebox{flex:1;min-height:0}iframe{width:100%;height:100%;border:0;display:block}iframe[hidden],[hidden]{display:none!important}button:focus-visible,a:focus-visible{outline:3px solid #d39b36;outline-offset:2px}@media(max-width:760px){.bar{padding:9px 10px}.brand b{font-size:17px}.brand span{font-size:11px}.tabs button,.sections a{padding:7px 10px}}@media print{.bar,.sections{display:none}.framebox{height:auto}iframe{height:100vh}}
</style></head><body><div class="shell"><header class="bar"><div class="brand"><b>三晋秋行 · 十一山西自驾</b><span>2026.09.30—10.07 · 高德高速优先实算约4,016公里 · 2人电车</span></div><div class="tabs"><button class="active" data-view="illustration">插画总览</button><button data-view="plan">行程执行</button><button data-view="guide">景点攻略</button><button id="share">复制分享链接</button></div></header><nav class="sections" aria-label="行程章节" hidden><a href="#overview" data-section="overview">8天安排</a><a href="#map" data-section="map">高德路线</a><a href="#hotels" data-section="hotels">住宿</a><a href="#charge" data-section="charge">补能</a><a href="#food" data-section="food">顺路吃饭</a><a href="#calendar" data-section="calendar">预约</a></nav><div class="framebox"><iframe id="illustrationFrame" title="插画总览" src="illustration.html?v=20260916-6"></iframe><iframe id="planFrame" title="行程执行" hidden src="plan.html?v=20260916-6"></iframe><iframe id="guideFrame" title="景点攻略" hidden src="guide.html?v=20260916-6"></iframe></div></div><script>
const frames={illustration:document.getElementById('illustrationFrame'),plan:document.getElementById('planFrame'),guide:document.getElementById('guideFrame')};const sections=document.querySelector('.sections'),sectionIds=new Set(['overview','daily','map','hotels','charge','food','calendar']);
function frameScroll(frame,id){let doc=frame.contentDocument,el=doc&&doc.getElementById(id);if(el){el.scrollIntoView({block:'start'});return true}return false}
function show(view,anchor,push=true){if(!frames[view])view='illustration';Object.entries(frames).forEach(([k,f])=>f.hidden=k!==view);document.querySelectorAll('[data-view]').forEach(b=>b.classList.toggle('active',b.dataset.view===view));sections.hidden=view!=='plan';document.querySelectorAll('[data-section]').forEach(a=>a.classList.toggle('active',view==='plan'&&a.dataset.section===anchor));let frame=frames[view],go=()=>anchor&&frameScroll(frame,anchor);if(frame.contentDocument?.readyState==='complete')go();else frame.addEventListener('load',go,{once:true});if(push){let h=view==='illustration'?'illustration':view==='guide'?(anchor?'guide-'+anchor:'guide'):(anchor||'overview');history.pushState(null,'','#'+h)}}
document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>show(b.dataset.view,null));document.querySelectorAll('[data-section]').forEach(a=>a.onclick=e=>{e.preventDefault();show('plan',a.dataset.section)});window.addEventListener('message',e=>{if(Object.values(frames).some(f=>e.source===f.contentWindow)){let view=e.data?.tripView==='guide'?'guide':'plan',anchor=(e.data?.anchor||'').replace(/^#/,'');show(view,anchor)}});
function routeHash(){let h=decodeURIComponent(location.hash.slice(1));if(h.startsWith('guide-'))show('guide',h.slice(6),false);else if(h==='guide')show('guide',null,false);else if(h==='illustration'||!h)show('illustration',null,false);else show('plan',sectionIds.has(h)?h:'overview',false)}window.addEventListener('hashchange',routeHash);window.addEventListener('load',routeHash);
document.getElementById('share').onclick=async()=>{let u=location.origin+location.pathname;try{await navigator.clipboard.writeText(u);document.getElementById('share').textContent='已复制 ✓';setTimeout(()=>document.getElementById('share').textContent='复制分享链接',1600)}catch(e){window.prompt('复制这个分享链接：',u)}};
</script></body></html>
