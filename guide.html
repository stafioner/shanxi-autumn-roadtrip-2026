如何共同组织内部空间；寻找题记与塑像，理解建筑年代判断不是只靠风格。"],"南禅寺":["大殿重建于唐建中三年（782），是现存最早的木结构建筑之一。小尺度殿宇保存了早期木构直接、简洁的受力和空间关系。","站在院中先看三间方殿的整体比例，再看柱头斗拱、梁架与屋顶；进入后观察佛坛塑像与殿内尺度，不要因为体量小而匆忙离开。"],"广胜寺":["始建于东汉，现存格局以元明遗构为主。上寺飞虹塔是明代重建的琉璃塔，下寺与水神庙保存元代壁画，是宗教建筑与地方水神信仰并置的典型。","先看建筑年代和中轴关系，再看飞虹塔琉璃构件的层层收分；水神庙壁画要找生活场景、戏曲图像和不同人物身份，而不只是拍全景。"],"隰县小西天":["寺院创建于明崇祯年间，大雄宝殿利用木构梁架悬塑出佛国世界。悬塑不是零散塑像，而是建筑、彩绘、楼阁与人物共同构成的三维叙事。","先辨认主尊与两侧群像，再从下往上看天宫楼阁、飞天和密集人物；留意远近尺度变化如何制造深度，避免只用手机放大寻找单尊。"],"双林寺":["双林寺旧称中都寺，与平遥古城、镇国寺共同列入世界遗产。现存殿宇以明清为主，彩塑延续宋元传统并形成强烈的世俗人物观察。","重点看韦驮像的身体扭转、罗汉群像的表情差异、菩萨衣纹与冠饰；比较同一殿内主尊的稳定和护法、侍从的动态。"],"镇国寺":["镇国寺万佛殿建于五代北汉天会七年（963），是中国现存极少的五代木构。寺院后部明清建筑使人能在同一院落比较多个时代。","观察万佛殿屋顶低缓、出檐深远、斗拱尺度大于后世常见做法；再与三佛楼的梁架、门窗和空间尺度比较，理解早期木构的雄浑感。"],"显通寺":["五台山汉传佛教核心寺院之一，寺史可追溯至东汉，现存建筑跨明清多个时期。无量殿以砖券结构形成无梁空间，铜殿则反映明代皇家供养。","沿中轴辨认木构殿、砖券无量殿和铜殿三种材料体系；注意它们解决跨度、防火和象征性的方法不同。"],"塔院寺":["寺名来自院内大白塔。现塔为明代在元代尼泊尔匠师阿尼哥式样基础上重建，是汉藏佛教交流与五台山视觉秩序的核心地标。","先从远处看白塔如何控制台怀镇天际线，再近看覆钵、相轮和塔刹的垂直比例；木牌坊与殿宇负责把人的步行轴线引向塔。"],"雁门关":["雁门关控制晋北南北通道，历代关城不断迁建修复。今天看到的关城兼有军事地形、边塞交通与后世重建展示价值。","不要只看城楼；先看山口收束和道路方向，再看关门、城墙、烽燧如何形成防御层次，区分历史遗存、修复体和旅游展示。"],"应县木塔":["佛宫寺释迦塔建于辽清宁二年（1056），是现存最高最古老的木塔之一。五层外观中夹有暗层，复杂铺作共同分担荷载并抵抗侧向力。","退远看五层六檐的稳定比例，近看不同层斗拱变化；理解斗拱不是装饰，而是传力、挑檐和抗震体系。首层佛像与内槽空间也属于整体设计。"],"应县净土寺":["净土寺大雄宝殿为金代遗构，殿内天宫楼阁藻井把佛国宫殿缩入梁架之下，木作、彩绘与空间幻觉结合。","进入后先适应暗光，再仰看藻井从方形空间向中心收束；比较真实梁架与装饰性楼阁，分辨结构构件和象征世界。"],"悬空寺":["悬空寺依恒山峡谷崖壁营建，现存建筑多经明清修葺。横梁、立柱、岩体承托和建筑群彼此咬合，价值在于因地制宜的空间组织。","谷底先看整体与岩壁关系，登临后看狭窄廊道、错层和殿阁互借空间；不要把外露立柱简单理解成全部承重体系。"],"浑源永安禅寺＋圆觉寺塔":["永安禅寺以元明壁画闻名，圆觉寺塔则是金代密檐式砖塔。两处把浑源从“悬空寺中转站”还原为有连续宗教建筑史的县城。","永安寺先看壁画人物等级、服饰和仪仗秩序；圆觉寺塔从外围观察塔身收分、密檐节奏与塔刹，不追求贴近围栏。"],"华严寺":["华严寺源于辽代皇家寺院传统，薄伽教藏殿保存辽代木构、彩塑和藏经壁藏，大雄宝殿为金代大尺度佛殿。","先在薄伽教藏殿理解“建筑中的建筑”：壁藏与天宫楼阁围合佛殿；再到大雄宝殿比较辽金木构尺度、梁架和塑像布局。"],"九龙壁":["九龙壁原为明代代王府前照壁，琉璃构件兼具礼制、镇护与建筑界面作用。水池倒影强化了壁面横向展开。","先数九条龙的姿态和彼此穿插，再看釉色、海水江崖纹和须弥座；留意每条龙并非复制，而是用方向和动作维持整体节奏。"],"善化寺":["善化寺保存辽金时期山门、三圣殿和大雄宝殿，是少见的完整寺院轴线。金代彩塑与建筑空间共同构成礼佛秩序。","从山门开始看屋顶等级与中轴层层抬升；三圣殿重点看斗拱，大雄宝殿看彩塑群像如何与柱网、佛坛配合。"],"云冈石窟":["云冈开凿于北魏平城时代，早期昙曜五窟强调帝王化巨像，中期洞窟吸收中亚、印度与汉地建筑纹样，记录北魏国家佛教的变化。","按5—20窟大致时间线观察：先看巨像尺度和窟形，再比较第5、6窟密集叙事与装饰。关注造像衣纹、面相和建筑纹样的汉化过程。"]};
const esc=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function status(x){if(x.mode==='抢票')return'rush';if(x.mode==='预约'||x.mode.includes('预购')||x.mode==='随联票')return'reserve';if(x.mode.includes('免费')||x.mode.includes('现场'))return'easy';return'pending'}
function tier(x){return x.tier==='must'?'主线必看':x.tier==='free'?'免费快看':'顺路/机动'}
function dwell(x){let m=x.route.match(/(\d{1,2}:\d{2})[–—-](\d{1,2}:\d{2})/);return m?m[1]+'–'+m[2]:x.route.split('；')[0]}
function src(x){return S[x.src]||['政策来源待补充','#']}function amap(n){return'https://uri.amap.com/search?keyword='+encodeURIComponent(n)+'&src=shanxi-roadtrip-2026'}
function render(){let q=document.getElementById('search').value.trim().toLowerCase(),d=document.getElementById('day').value,f=document.getElementById('filter').value;let list=spots.filter(x=>(!q||JSON.stringify(x).toLowerCase().includes(q))&&(d==='all'||x.d.includes(d))&&(f==='all'||status(x)===f));document.getElementById('count').textContent='显示 '+list.length+' / '+spots.length+' 个';document.getElementById('ticketRows').innerHTML=list.map(x=>`<tr><td>${esc(x.d)}</td><td><button class="spot-link" data-open="${esc(x.n)}">${esc(x.n)}</button></td><td>${tier(x)}</td><td>${esc(x.fee)}</td><td><span class="pill ${status(x)}">${esc(x.mode)}</span></td><td><b>${esc(x.when)}</b></td><td>${esc(x.action)}</td><td>${esc(x.channel)}</td><td>${esc(dwell(x))}</td></tr>`).join('');document.getElementById('guideCards').innerHTML=list.map(x=>{let h=heritage[x.n]||[],s=src(x);return`<details id="spot-${esc(x.n)}"><summary><div><span class="pill ${status(x)}">${esc(x.mode)}</span><h3>${esc(x.n)}</h3><p>${esc(x.d)} · ${esc(x.kind)} · ${tier(x)}</p></div></summary><div class="body"><div class="facts"><div class="fact"><b>开放时间</b>${esc(x.time)}</div><div class="fact"><b>门票与预约</b>${esc(x.fee)}<br>${esc(x.book)}</div><div class="fact"><b>本次安排</b>${esc(x.route)}</div><div class="fact"><b>晚点切法</b>${esc(x.late)}</div></div>${h[0]?`<h4>背景知识</h4><p>${esc(h[0])}</p>`:''}<h4>重点看什么</h4><p>${esc(x.look)}</p>${h[1]?`<h4>现场怎么读懂</h4><p>${esc(h[1])}</p>`:''}<h4>实用提醒</h4><p>${esc(x.tips)}</p><div class="actions"><a target="_blank" rel="noopener" href="${amap(x.n)}">高德查入口 ↗</a><a class="alt" target="_blank" rel="noopener" href="${s[1]}">查看政策来源 ↗</a></div></div></details>`}).join('')}
const todos=[['09/19','云冈石窟 10/4','预计进入15日预约窗，确认官方放票时刻并购买上午后段场次。'],['09/26','小西天 10/2','预计进入提前7日实名预约窗；上午开始查看官方渠道。'],['09/28 07:15','悬空寺预检查','检查两人实名信息、支付和10/5上午场。'],['09/29 07:20','悬空寺 10/5','抢入园票＋登临票，场次要与09:35左右抵达匹配。'],['10/03 23:55','五台山预检查','当前计划10/5傍晚进入台怀镇，按实际入山日准备预约。'],['10/04 00:00','五台山 10/5入山','按现行提前一天口径预约游客与车辆；国庆专门公告优先。']];document.getElementById('todoGrid').innerHTML=todos.map((r,i)=>`<label><time>${r[0]}</time><input type="checkbox" data-check="${i}"> <b>${r[1]}</b><span>${r[2]}</span></label>`).join('');
const critical=['云冈石窟','隰县小西天','悬空寺','五台山景区入山与接驳','山西黄河壶口瀑布','应县木塔','雁门关','佛光寺','南禅寺'];document.getElementById('policyList').innerHTML=critical.map(n=>{let x=spots.find(y=>y.n===n),s=src(x);return`<div class="policy-row"><b>${esc(n)}</b><div><p><strong>${esc(x.mode)} · ${esc(x.when)}</strong>　${esc(x.action)}</p><p>${esc(x.book)}</p><small>核验状态：${x.status==='verified'?'已有2026规则':x.status==='pattern'?'季节规则，待国庆公告':'出发前复核'}　·　<a target="_blank" rel="noopener" href="${s[1]}">${esc(s[0])} ↗</a></small></div></div>`}).join('');
['search','day','filter'].forEach(id=>document.getElementById(id).addEventListener(id==='search'?'input':'change',render));document.addEventListener('click',e=>{let b=e.target.closest('[data-open]');if(!b)return;document.getElementById('search').value=b.dataset.open;document.getElementById('day').value='all';document.getElementById('filter').value='all';render();let el=document.getElementById('spot-'+b.dataset.open);if(el){el.open=true;el.scrollIntoView({behavior:'smooth',block:'start'})}});render();
document.querySelectorAll('[data-check]').forEach(c=>{let k='sx-ticket-'+c.dataset.check;try{c.checked=localStorage.getItem(k)==='1'}catch(e){}c.closest('label').classList.toggle('done',c.checked);c.onchange=()=>{c.closest('label').classList.toggle('done',c.checked);try{localStorage.setItem(k,c.checked?'1':'0')}catch(e){}}});
document.getElementById('downloadIcs').onclick=()=>{let out=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Shanxi Roadtrip 2026//CN','CALSCALE:GREGORIAN','X-WR-CALNAME:山西自驾抢票提醒'];[['20260919T090000','云冈石窟10月4日预约'],['20260926T080000','小西天10月2日预约窗口'],['20260928T071500','悬空寺抢票预提醒'],['20260929T072000','悬空寺10月5日登临票'],['20261003T235500','五台山10月5日入山预约预提醒'],['20261004T000000','五台山10月5日游客与车辆预约']].forEach((e,i)=>out.push('BEGIN:VEVENT','UID:sx-ticket-'+i+'@trip','DTSTART;TZID=Asia/Shanghai:'+e[0],'DURATION:PT45M','SUMMARY:'+e[1],'DESCRIPTION:以官方小程序当时显示的可售日期和国庆公告为准。','END:VEVENT'));out.push('END:VCALENDAR');let u=URL.createObjectURL(new Blob([out.join('\r\n')],{type:'text/calendar'})),a=document.createElement('a');a.href=u;a.download='山西自驾-抢票提醒.ics';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)};</script></body></html>
